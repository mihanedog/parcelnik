<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcelnik</title>
<meta name="description" content="Odprt pregledovalnik parcel, stavb, namenske rabe in omejitev za vso Slovenijo, zgrajen na javnih storitvah GURS in MNVP.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: full-bleed map; left dock (search + layers) on desktop, bottom sheet on phone; info panel slides from the right. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --panel-2:#eef2f0; --fg:#15201b; --fg-2:#4b5a53; --fg-3:#7a877f;
  --line:#d5ddd8; --accent:#1f7a4d; --accent-2:#e4f2ea; --accent-ink:#0f5a36;
  --warn:#9a5b00; --warn-2:#fff3df; --hl:#ff7a00;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --shadow:0 6px 24px rgba(10,25,18,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --panel:#172019; --panel-2:#1f2a23; --fg:#e8eee9; --fg-2:#aab6ae; --fg-3:#7d8a82;
    --line:#2b3831; --accent:#4fbf84; --accent-2:#173526; --accent-ink:#8fe0b4;
    --warn:#f0b35a; --warn-2:#3a2a10; --hl:#ff9a3c; --shadow:0 6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#172019; --panel-2:#1f2a23; --fg:#e8eee9; --fg-2:#aab6ae; --fg-3:#7d8a82;
  --line:#2b3831; --accent:#4fbf84; --accent-2:#173526; --accent-ink:#8fe0b4;
  --warn:#f0b35a; --warn-2:#3a2a10; --hl:#ff9a3c; --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{font:inherit}

/* top bar */
.topbar{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:1000;display:flex;gap:8px;align-items:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;box-shadow:var(--shadow);font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:18px;height:18px}
.search{flex:1;max-width:560px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 12px;outline:none}
.search input:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.search button{border:0;background:transparent;padding:0 12px;cursor:pointer;color:var(--fg-2)}
.search button:hover{color:var(--accent-ink)}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:50vh;overflow:auto;z-index:5}
.sugg div{padding:8px 12px;cursor:pointer;border-top:1px solid var(--line)}
.sugg div:first-child{border-top:0}
.sugg div:hover,.sugg div.on{background:var(--accent-2)}
.sugg small{display:block;color:var(--fg-3);font-family:var(--mono);font-size:11px}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.iconbtn[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent)}
.iconbtn svg{width:16px;height:16px}

/* layer dock */
.dock{position:absolute;z-index:1000;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 58px);width:300px;max-height:calc(100% - 90px - env(safe-area-inset-top,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.dock[hidden]{display:none}
.dock header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.dock .body{overflow:auto;padding:6px 0 10px}
.grp{padding:6px 12px 2px}
.grp h4{margin:8px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.lay{display:flex;align-items:center;gap:8px;padding:4px 0}
.lay input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.lay label{flex:1;cursor:pointer}
.lay .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid var(--line)}
.lay input[type=range]{width:70px;accent-color:var(--accent)}
.base{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 4px}
.base button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:12px}
.base button[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* info panel */
.info{position:absolute;z-index:1001;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);width:380px;max-width:calc(100% - 32px);
  max-height:calc(100% - 90px - env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.info[hidden]{display:none}
.info header{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.info header .t{flex:1;min-width:0}
.info header .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.info header h2{margin:2px 0 0;font-size:22px;line-height:1.15;font-family:var(--mono);font-weight:500;text-wrap:balance}
.info header .sub{color:var(--fg-2);margin-top:2px}
.x{border:0;background:transparent;cursor:pointer;padding:4px;color:var(--fg-3);border-radius:6px}
.x:hover{background:var(--panel-2);color:var(--fg)}
.info .body{overflow:auto;padding:4px 14px 14px}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 10px;margin:8px 0}
.kv dt{color:var(--fg-3);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.sec h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:600;display:flex;align-items:center;gap:6px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--accent-2);color:var(--accent-ink);font-family:var(--mono)}
.chip.w{background:var(--warn-2);color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a,.links button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;text-decoration:none;color:var(--fg);background:var(--panel-2);font-size:13px;cursor:pointer}
.links a.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.links svg{width:13px;height:13px}
.note{font-size:12px;color:var(--fg-2);margin:8px 0 0}
.empty{padding:18px 14px;color:var(--fg-2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* podatkovni sloji */
.sub{margin:2px 0 8px 23px;padding:8px 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sub[hidden]{display:none}
.row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;font-size:12.5px}
.row.wrap{flex-wrap:wrap}
.row>label:first-child:not(.pill){min-width:46px;color:var(--fg-3)}
.row select,.row input[type=number]{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:3px 6px;min-width:0;width:80px;font-size:12.5px}
.row select{width:auto;max-width:160px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 4px;font-size:12px;cursor:pointer;background:var(--panel-2)}
.pill input{accent-color:var(--accent);margin:0}
.cnt{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.list{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.list div{padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12.5px;line-height:1.3}
.list div:hover{background:var(--accent-2)}
.list small{color:var(--fg-3);display:block;font-family:var(--mono);font-size:11px}
.etn-lbl{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font:11px var(--mono);color:var(--fg);white-space:nowrap;box-shadow:var(--shadow)}
.kme-ic{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#f0a30a;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.kme-ic.off{background:#9aa}
/* bottom status */
.status{position:absolute;z-index:1000;left:max(16px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--fg-2);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;box-shadow:var(--shadow);max-width:calc(100% - 32px);overflow:hidden;white-space:nowrap}
.status b{color:var(--fg);font-weight:500}
.leaflet-control-attribution{font-size:10px;background:var(--panel)!important;color:var(--fg-2)!important}
.leaflet-control-attribution a{color:var(--accent-ink)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--fg)!important;border-bottom-color:var(--line)!important}
.leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom,0px)}
.leaflet-control-scale-line{background:var(--panel)!important;color:var(--fg)!important;border-color:var(--fg-2)!important}
.leaflet-top.leaflet-left{top:calc(env(safe-area-inset-top,0px) + 58px);left:max(16px,env(safe-area-inset-left,0px))}
.dock:not([hidden]) ~ .leaflet-container .leaflet-top.leaflet-left{left:332px}

@media (max-width:760px){
  .brand span{display:none}
  .topbar{flex-wrap:nowrap}
  .dock{left:0;right:0;top:auto;bottom:0;width:auto;max-height:55%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .info{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:62%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .info .body,.dock .body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .status{display:none}
  .dock:not([hidden]) ~ .leaflet-container .leaflet-top.leaflet-left{left:max(16px,env(safe-area-inset-left,0px))}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand" title="Parcelnik — odprt pregledovalnik prostora">
    <svg viewBox="0 0 20 20" fill="none" stroke="var(--accent)" stroke-width="1.8"><path d="M2 5l6-2 5 2 5-2v12l-5 2-5-2-6 2z"/><path d="M8 3v12M13 5v12"/></svg>
    <span>Parcelnik</span>
  </div>
  <form class="search" id="sform" autocomplete="off" role="search">
    <input id="q" placeholder="k.o. + parcela (850 430/17), naslov ali kraj" aria-label="Iskanje">
    <button type="submit" aria-label="Išči"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></button>
    <div class="sugg" id="sugg" hidden></div>
  </form>
  <button class="iconbtn" id="tgLayers" aria-pressed="true" title="Sloji"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2l6 3-6 3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/></svg><span class="lbl">Sloji</span></button>
  <button class="iconbtn" id="tgLoc" title="Moja lokacija"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg></button>
</div>

<aside class="dock" id="dock">
  <header><span>Sloji</span><button class="x" id="dockClose" aria-label="Zapri">✕</button></header>
  <div class="body">
    <div class="base" id="basemaps"></div>
    <div class="grp" id="dataLayers">
      <h4>Podatkovni sloji</h4>
      <div class="lay"><input type="checkbox" id="l_etn"><span class="sw" style="background:#d64f8c"></span><label for="l_etn">Prodaje nepremičnin (ETN)</label><span class="cnt" id="etnCnt"></span></div>
      <div class="sub" id="etnFilters" hidden>
        <div class="row"><label>Leto</label><select id="etnY0"></select><span>–</span><select id="etnY1"></select></div>
        <div class="row wrap" id="etnKinds">
          <label class="pill"><input type="checkbox" value="stan" checked> stanovanja</label>
          <label class="pill"><input type="checkbox" value="hisa" checked> hiše</label>
          <label class="pill"><input type="checkbox" value="posl" checked> garaže, poslovni, drugi deli</label>
          <label class="pill"><input type="checkbox" value="zst" checked> stavbna zemljišča</label>
          <label class="pill"><input type="checkbox" value="zkm" checked> kmetijska</label>
          <label class="pill"><input type="checkbox" value="zgo" checked> gozdna</label>
          <label class="pill"><input type="checkbox" value="zdr" checked> dvorišča, ceste, druga</label>
        </div>
        <div class="row"><label>Cena €</label><input type="number" id="etnC0" placeholder="od" min="0"><input type="number" id="etnC1" placeholder="do" min="0"></div>
        <div class="row"><label>€/m²</label><input type="number" id="etnM0" placeholder="od" min="0"><input type="number" id="etnM1" placeholder="do" min="0"></div>
        <div class="row"><label class="pill"><input type="checkbox" id="etnTrz" checked> brez netržnih poslov</label></div>
        <p class="note" id="etnNote"></p>
      </div>
      <div class="lay"><input type="checkbox" id="l_kme"><span class="sw" style="background:#f0a30a"></span><label for="l_kme">Kmetijska zemljišča naprodaj (UE)</label><span class="cnt" id="kmeCnt"></span></div>
      <div class="sub" id="kmeFilters" hidden>
        <div class="row"><label>UE</label><select id="kmeUE"><option value="">vse upravne enote</option></select></div>
        <div class="row"><label>Vrsta</label><select id="kmeV"><option value="">vse</option><option>kmetijsko zemljišče</option><option>kmetija</option><option>gozd</option></select></div>
        <p class="note" id="kmeNote"></p>
        <div id="kmeList" class="list"></div>
      </div>
    </div>
    <div id="layers"></div>
    <div class="grp"><p class="note">Vsi sloji so javne storitve <a href="https://www.e-prostor.gov.si/" target="_blank" rel="noopener">GURS</a> (CC BY 4.0) in <a href="https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-naravne-vire-in-prostor/" target="_blank" rel="noopener">MNVP</a>. Parcele in stavbe se izrišejo pri merilu pod 1 : 10 000.</p></div>
  </div>
</aside>

<aside class="info" id="info" hidden>
  <header>
    <div class="t" id="infoHead"></div>
    <button class="x" id="infoClose" aria-label="Zapri">✕</button>
  </header>
  <div class="body" id="infoBody"></div>
</aside>

<div class="status" id="status"><span id="stCoord">—</span><span>·</span><span id="stScale"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.min.js"></script>
<script>
/* ---------- konfiguracija virov ---------- */
const SRC = {
  kn:  'https://ipi.eprostor.gov.si/wms-si-gurs-kn/ows',
  knWfs:'https://ipi.eprostor.gov.si/wfs-si-gurs-kn/wfs',
  rnWfs:'https://ipi.eprostor.gov.si/wfs-si-gurs-rn/wfs',
  dts: 'https://ipi.eprostor.gov.si/wms-si-gurs-dts/ows',
  kgi: 'https://ipi.eprostor.gov.si/wms-si-gurs-kgi/ows',
  pa:  'https://ipi.eprostor.gov.si/wms-si-mnvp-pa/ows',
};
const ATTR_GURS = '&copy; <a href="https://www.e-prostor.gov.si/" target="_blank" rel="noopener">GURS</a> CC BY 4.0';
const ATTR_PA   = '&copy; <a href="https://www.gov.si/" target="_blank" rel="noopener">MNVP</a> PIS';
proj4.defs('EPSG:3794','+proj=tmerc +lat_0=0 +lon_0=15 +k=0.9999 +x_0=500000 +y_0=-5000000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
const toD96 = (lat,lng)=>proj4('EPSG:4326','EPSG:3794',[lng,lat]);
const fromD96 = (e,n)=>{const [lng,lat]=proj4('EPSG:3794','EPSG:4326',[e,n]);return [lat,lng];};

/* ---------- zemljevid ---------- */
const map = L.map('map',{zoomControl:true,minZoom:7,maxZoom:21,attributionControl:true}).setView([46.12,14.82],8);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');

const BASES = {
  osm:  {name:'OSM', layer:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'})},
  dof:  {name:'Ortofoto', layer:L.tileLayer.wms(SRC.dts,{layers:'SI.GURS.ZPDZ:DOF025_3857',format:'image/jpeg',version:'1.3.0',maxZoom:21,attribution:ATTR_GURS})},
  dtk:  {name:'DTK 50', layer:L.tileLayer.wms(SRC.dts,{layers:'SI.GURS.DK:DTK50',format:'image/jpeg',version:'1.3.0',maxZoom:21,attribution:ATTR_GURS})},
  lidar:{name:'Lidar', layer:L.tileLayer.wms(SRC.dts,{layers:'SI.GURS.ZPDZ:LIDAR',format:'image/jpeg',version:'1.3.0',maxZoom:21,attribution:ATTR_GURS})},
  ttn:  {name:'TTN 5/10', layer:L.tileLayer.wms(SRC.dts,{layers:'SI.GURS.DK:TTN5_TTN10',format:'image/png',version:'1.3.0',maxZoom:21,attribution:ATTR_GURS})},
  none: {name:'Brez', layer:L.layerGroup()},
};
let curBase='osm';
function setBase(k){ if(BASES[curBase]) map.removeLayer(BASES[curBase].layer); curBase=k; BASES[k].layer.addTo(map); BASES[k].layer.bringToBack?.();
  document.querySelectorAll('#basemaps button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k)); saveState(); }
const bm=document.getElementById('basemaps');
for(const k in BASES){const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=BASES[k].name;b.onclick=()=>setBase(k);bm.appendChild(b);}

/* overlay layers: {id, group, name, url, layers, styles?, color, on, opacity, query:[layers to GetFeatureInfo]} */
const OVER = [
 {id:'parc', g:'Kataster nepremičnin', name:'Parcele + oznake', url:SRC.kn, layers:'SI.GURS.KN:PARCELE,SI.GURS.KN:OSNOVNI_PARCELE_CENTROID', styles:'nep_kn_parcele,nep_kn_parcele_cent_lbl', color:'#2fa15e', on:true, z:650},
 {id:'meje', g:'Kataster nepremičnin', name:'Urejene meje', url:SRC.kn, layers:'SI.GURS.KN:UREJENE_MEJE', color:'#7be09e', on:false, z:640},
 {id:'stav', g:'Kataster nepremičnin', name:'Stavbe', url:SRC.kn, layers:'SI.GURS.KN:STAVBE', color:'#f08a24', on:true, z:645},
 {id:'hs',   g:'Kataster nepremičnin', name:'Hišne številke', url:SRC.kn, layers:'SI.GURS.KN:HISNE_STEVILKE', styles:'nep_rpe_hs_lbl', color:'#333', on:false, z:660},

function gfiUrl(base,layers,latlng,count=10){
  // fiksno okno 101×101 px okoli klika v merilu trenutnega zooma (neodvisno od velikosti zaslona)
  const mpp=40075016.686*Math.cos(latlng.lat*Math.PI/180)/Math.pow(2,map.getZoom()+8), half=50.5*mpp;
  const dLat=half/111320, dLng=half/(111320*Math.cos(latlng.lat*Math.PI/180));
  const q=new URLSearchParams({SERVICE:'WMS',VERSION:'1.3.0',REQUEST:'GetFeatureInfo',LAYERS:layers,QUERY_LAYERS:layers,CRS:'EPSG:4326',
    BBOX:`${latlng.lat-dLat},${latlng.lng-dLng},${latlng.lat+dLat},${latlng.lng+dLng}`,WIDTH:101,HEIGHT:101,I:50,J:50,INFO_FORMAT:'application/json',FEATURE_COUNT:count});
  return base+'?'+q;
}

function pip(pt,geom){ // točka v (multi)poligonu, ray-cast po zunanjem obroču
  if(!geom) return true; const rings=geom.type==='Polygon'?[geom.coordinates[0]]:geom.type==='MultiPolygon'?geom.coordinates.map(p=>p[0]):[];
  if(!rings.length) return true; const x=pt.lng,y=pt.lat;
  return rings.some(r=>{let inside=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;}return inside;});
}
function renderClick(kn,pa,latlng){

      body+=`<dl class="kv" style="margin-top:-2px"><dt>Lastniki (ZK)</dt><dd>${who.length?`<span class="chip">javna last: ${esc(who.join(' + '))}</span> `:''}${fmtNum(javl.VSI_LASTNIKI_CNT)} ${javl.VSI_LASTNIKI_CNT==1?'lastnik':'lastnikov'}${javl.PRAVNI_LASTNIKI_CNT?`, od tega ${fmtNum(javl.PRAVNI_LASTNIKI_CNT)} pravn${javl.PRAVNI_LASTNIKI_CNT==1?'a oseba':'ih oseb'}`:''}<br><small style="color:var(--fg-3)">imena so v zemljiški knjigi (gumb spodaj)</small></dd></dl>`;

const q=document.getElementById('q'), sugg=document.getElementById('sugg');

function mark(){ [...sugg.children].forEach((c,i)=>c.classList.toggle('on',i===sIdx)); }
function parseParcel(t){
  // "850 430/17", "850-430/17", "slovenj gradec 430/17", "430/17 slovenj gradec"
  let m=t.match(/^\s*(\d{1,4})\s*[-\s]\s*(\d+(?:\/\d+)?)\s*$/); if(m) return {koId:+m[1],st:m[2]};
  m=t.match(/^\s*(.+?)\s+(\d+\/\d+|\d+)\s*$/); if(m&&isNaN(m[1])) return {koName:m[1],st:m[2]};
  m=t.match(/^\s*(\d+\/\d+)\s+(.+?)\s*$/); if(m) return {koName:m[2],st:m[1]};
  return null;
}
async function suggest(){
  const t=q.value.trim(); sItems=[]; sIdx=-1; if(t.length<2){sugg.hidden=true;return;}
  const p=parseParcel(t); let items=[];
  try{
    if(p){
      const f=p.koId?`KO_ID=${p.koId} AND ST_PARCELE='${p.st}'`:`NAZIV ILIKE '%${p.koName.replace(/'/g,"''")}%' AND ST_PARCELE='${p.st}'`;
      const j=await fetch(`${SRC.knWfs}?service=WFS&version=2.0.0&request=GetFeature&typeNames=SI.GURS.KN:PARCELE&outputFormat=application/json&srsName=EPSG:4326&count=8&CQL_FILTER=${encodeURIComponent(f)}`).then(r=>r.json());
      items=(j.features||[]).map(ft=>({t:`Parcela ${ft.properties.ST_PARCELE}`,s:`k.o. ${ft.properties.NAZIV} · ${fmtNum(ft.properties.POVRSINA)} m²`,geo:ft}));
    }
    if(!items.length){
      // naslov iz registra naslovov: "Gozdna pot 1, Slovenj Gradec" ali "Gozdna pot 1"
      const a=t.match(/^\s*([^\d,]+?)\s+(\d+)\s*([a-zA-Z])?\s*(?:,\s*(.+))?$/);
      if(a){
        let f=`ULICA_NAZIV ILIKE '${a[1].trim().replace(/'/g,"''")}%' AND HS_STEVILKA=${+a[2]}`;
        if(a[3]) f+=` AND HS_DODATEK ILIKE '${a[3]}'`;
        if(a[4]) f+=` AND (NASELJE_NAZIV ILIKE '${a[4].trim().replace(/'/g,"''")}%' OR POSTNI_OKOLIS_NAZIV ILIKE '${a[4].trim().replace(/'/g,"''")}%')`;
        const j=await fetch(`${SRC.rnWfs}?service=WFS&version=2.0.0&request=GetFeature&typeNames=SI.GURS.RN:REGISTER_NASLOVOV&outputFormat=application/json&count=8&CQL_FILTER=${encodeURIComponent(f)}`).then(r=>r.json());
        const seen=new Set(); items=(j.features||[]).filter(ft=>{const k=ft.properties.EID_HISNA_STEVILKA;if(seen.has(k))return false;seen.add(k);return true;}).map(ft=>{const p=ft.properties; return {t:`${p.ULICA_NAZIV||p.NASELJE_NAZIV} ${p.HS_STEVILKA}${p.HS_DODATEK||''}`,s:`${p.POSTNI_OKOLIS_SIFRA} ${p.NASELJE_NAZIV} · ${p.OBCINA_NAZIV}`,ll:fromD96(p.E,p.N),z:18};});
      }
    }
    if(!items.length){
      // kraj / naselje (OSM Nominatim)
      const j=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=si&limit=6&q=${encodeURIComponent(t)}`,{headers:{'Accept-Language':'sl'}}).then(r=>r.json());
      items=j.map(r=>({t:r.display_name.split(',')[0],s:r.display_name.split(',').slice(1,4).join(',').trim(),ll:[+r.lat,+r.lon],z:r.type==='administrative'?13:16}));
    }
  }catch(e){}
  sItems=items; sugg.innerHTML=items.length?items.map(i=>`<div>${esc(i.t)}<small>${esc(i.s)}</small></div>`).join(''):'<div><small>Ni zadetkov</small></div>';
  sugg.hidden=false; [...sugg.children].forEach((c,i)=>c.onclick=()=>pick(i));
}
function pick(i){ const it=sItems[i]; if(!it)return; sugg.hidden=true; q.value=it.t;
  if(it.geo){ hiLayer.clearLayers(); hiLayer.addData(it.geo); map.fitBounds(hiLayer.getBounds(),{maxZoom:19,padding:[40,40]}); const c=centroidOf(it.geo); setTimeout(()=>map.fire('click',{latlng:c}),400); }
  else { map.setView(it.ll,it.z||17); L.circleMarker(it.ll,{radius:7,color:'#ff7a00',weight:3,fillOpacity:.2}).addTo(map); }
}

async function etnForParcel(parc){
  const box=document.getElementById('etnParc'); if(!box) return; const idx=await etnIndex(); const C=idx.cell||10000;
  const key=`${Math.floor(parc.E_CEN/C)}_${Math.floor(parc.N_CEN/C)}`; let poly=hiLayer.getLayers()[0]?.feature?.geometry; if(!poly){ const f=await fetchParcelGeom(parc.KO_ID,parc.ST_PARCELE); poly=f?.geometry; }
  const years=Object.keys(idx.years); const all=(await Promise.all(years.filter(y=>(idx.years[y].cells||[]).includes(key)).map(y=>etnLoadCell(y,key)))).flat();
  const hits=all.filter(r=>(r.t==='z'&&String(r.ko)===String(parc.KO_ID)&&r.parc===parc.ST_PARCELE)||(r.t==='s'&&poly&&pip({lat:fromD96(r.e,r.nn)[0],lng:fromD96(r.e,r.nn)[1]},poly))).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));
  if(!box.isConnected) return;
  if(!years.length){ box.innerHTML='<h3>Prodaje te parcele (ETN)</h3><p class="note">Podatki ETN še niso naloženi.</p>'; return; }
  if(!hits.length){ box.innerHTML=`<h3>Prodaje te parcele (ETN)</h3><p class="note">Ni evidentiranih prodaj v letih ${years[0]}–${years[years.length-1]}.</p>`; return; }
  box.innerHTML=`<h3>Prodaje te parcele (ETN)</h3><div class="list">`+hits.slice(0,12).map((r,i)=>`<div data-i="${i}"><b>${(r.cena??r.cena_posla)!=null?fmtNum(r.cena??r.cena_posla)+' €':'cena ni navedena'}</b> · ${esc(r.dat||'')}${r.m2!=null?` · ${fmtNum(r.m2)} €/m²`:''}<small>${esc(r.t==='s'?(r.raba||'del stavbe')+(r.pov?` · ${fmtNum(r.pov)} m²`:''):(r.vzn||'zemljišče')+(r.pov?` · ${fmtNum(r.pov)} m²`:''))}${r.n>1?` · paket ${r.n}`:''}</small></div>`).join('')+`</div>`;
  box.querySelectorAll('.list div').forEach(d=>d.onclick=()=>{const r=hits[+d.dataset.i];etnShow(r,fromD96(r.e,r.nn));});
}

  const ues=[...new Set(KME.data.features.map(f=>f.properties.ue).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'sl')); kmeEl.ue.innerHTML='<option value="">vse upravne enote</option>'+ues.map(u=>`<option>${esc(u)}</option>`).join(''); return KME.data; }
function kmeRefresh(){
  if(!KME.on) return; const ue=kmeEl.ue.value, v=kmeEl.v.value; KME.layer.clearLayers();
  const fs=KME.data.features.filter(f=>(!ue||f.properties.ue===ue)&&(!v||f.properties.vrsta===v)).sort((a,b)=>(b.properties.pub||'').split('.').reverse().join('').localeCompare((a.properties.pub||'').split('.').reverse().join('')));
  let loc=0; fs.forEach(f=>{ if(!f.geometry) return; loc++; const m=L.marker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{icon:kmeIcon,pane:'p_kme'}).addTo(KME.layer); const p=f.properties;
    m.bindTooltip(`${esc(p.ko?.name||'')}${p.cena?` · ${fmtNum(p.cena)} €`:''}`,{direction:'top',offset:[0,-20],className:'etn-lbl'}); m.on('click',()=>kmeShow(f)); });
  kmeEl.cnt.textContent=fs.length?String(fs.length):''; kmeEl.note.textContent=`${fs.length} ponudb (${loc} z lokacijo na zemljevidu, ${fs.length-loc} brez – samo v seznamu). Stanje: ${KME.data.updated||'—'}.`;
  kmeEl.list.innerHTML=fs.slice(0,300).map((f,i)=>`<div data-i="${i}">${esc(f.properties.ko?.name||f.properties.title)}${f.properties.cena?` · <b>${fmtNum(f.properties.cena)} €</b>`:''}${f.geometry?'':' · <span style="color:var(--fg-3)">brez lokacije</span>'}<small>${esc(f.properties.ue||'')} · objava ${esc(f.properties.pub||'')} · do ${esc(f.properties.do||'')}</small></div>`).join('');
  kmeEl.list.querySelectorAll('div[data-i]').forEach(d=>d.onclick=()=>{const f=fs[+d.dataset.i]; if(f.geometry) map.setView([f.geometry.coordinates[1],f.geometry.coordinates[0]],Math.max(map.getZoom(),15)); kmeShow(f);});
}
function kmeShow(f){
  const p=f.properties;
  const head=`<div class="eyebrow">Ponudba za prodajo · ${esc(p.vrsta||'kmetijsko zemljišče')}</div><h2 style="font-family:var(--font);font-size:18px">${esc(p.ko?`k.o. ${p.ko.id?p.ko.id+' ':''}${p.ko.name}`:p.title)}</h2><div class="sub">${esc(p.ue||'')} · objava ${esc(p.pub||'')}${p.do?` · <b>sprejem do ${esc(p.do)}</b>`:''}</div>`;
  let body=`<dl class="kv"><dt>Cena</dt><dd class="m">${p.cena!=null?fmtNum(p.cena)+' €':'—'}${p.m2!=null?` <small style="color:var(--fg-3)">(${p.m2.toLocaleString('sl-SI',{maximumFractionDigits:2})} €/m²)</small>`:''}</dd><dt>Površina</dt><dd class="m">${p.pov!=null?fmtNum(Math.round(p.pov))+' m²':'—'}</dd><dt>Št. dokumenta</dt><dd class="m">${esc(p.doc||'')}</dd></dl>`;
  if(p.parcels?.length){ const geo=new Map((p.geo_parcels||[]).map(g=>[g.p,g])); body+=`<div class="sec"><h3>Parcele (${p.parcels.length})</h3><div class="links" id="kmeParc">`+p.parcels.map(x=>`<button type="button" data-p="${esc(x)}" ${geo.has(x)?'':'disabled title="ni najdena v katastru"'}>${esc(x)}${geo.has(x)?` <small>${fmtNum(geo.get(x).pov)} m²</small>`:''}</button>`).join('')+`</div></div>`; }
  body+=`<div class="sec"><h3>Dokument</h3><div class="links">${p.pdf?`<a class="p" href="${esc(p.pdf)}" target="_blank" rel="noopener">${ic('doc')} Odpri ponudbo (PDF)</a>`:''}<a href="https://e-uprava.gov.si/si/e-uprava/oglasnadeska/podrobnosti-objave.html?id=${esc(p.id)}" target="_blank" rel="noopener">${ic('board')} Objava na e-upravi</a></div>
  <p class="note">${p.ocr?'Cena, površina in parcele so prebrane iz skeniranega PDF-ja (OCR) in so informativne; merodajen je PDF. ':''}Izjavo o sprejemu ponudbe vložiš na upravni enoti v 30 dneh od objave (ZKZ, 20. člen).</p></div>`;
  showInfo(head,body);
  document.querySelectorAll('#kmeParc button:not([disabled])').forEach(b=>b.onclick=async()=>{ const g=(p.geo_parcels||[]).find(x=>x.p===b.dataset.p); const f=await fetchParcelGeom(g.ko,g.p); if(f) map.fitBounds(hiLayer.getBounds(),{maxZoom:18,padding:[40,40]}); });
}
kmeEl.on.onchange=async e=>{ KME.on=e.target.checked; kmeEl.f.hidden=!KME.on; if(KME.on){ KME.layer.addTo(map); await kmeLoad(); kmeRefresh(); } else { map.removeLayer(KME.layer); kmeEl.cnt.textContent=''; } };
kmeEl.ue.onchange=kmeEl.v.onchange=()=>kmeRefresh();

/* deep link ?p=KO:ST */
if(hp.get('p')){ const [ko,st]=hp.get('p').split(':'); fetchParcelGeom(ko,st).then(f=>{ if(f){ map.fitBounds(hiLayer.getBounds(),{maxZoom:19,padding:[40,40]}); setTimeout(()=>map.fire('click',{latlng:centroidOf(f)}),500);} }); }
</script>
</body>
</html>
